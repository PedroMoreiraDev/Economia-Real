services:
  postgres:
    image: postgres:16-alpine
    container_name: finance_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_db}
      POSTGRES_USER: ${POSTGRES_USER:-finance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance_user} -d ${POSTGRES_DB:-finance_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - finance_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finance_prod_backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-finance_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-finance_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-finance_password}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-finance-ai-2026-minimum-32-chars-long!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finance_prod_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finance_network

volumes:
  postgres_prod_data:
    driver: local

networks:
  finance_network:
    driver: bridge
