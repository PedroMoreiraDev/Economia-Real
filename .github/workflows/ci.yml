name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend - Testes Automatizados & Qualidade (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Executar Testes Automatizados do Backend
        working-directory: ./backend
        run: |
          chmod +x mvnw
          ./mvnw clean test -B

      - name: Publicar Relatórios Surefire em Caso de Falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/

  frontend-build:
    name: Frontend - Validação TypeScript & Build de Produção
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências Limpas
        working-directory: ./frontend
        run: npm ci

      - name: Checagem Rigorosa de Tipos TypeScript
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Compilar Bundle de Produção com Vite
        working-directory: ./frontend
        run: npm run build

      - name: Salvar Artefatos Compilados do Frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  docker-compose-validation:
    name: Docker - Validação de Orquestração e Configurações
    runs-on: ubuntu-latest
    needs: [ backend-test, frontend-build ]

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Validar Sintaxe e Composição do Docker Compose de Produção
        run: docker compose -f docker-compose.prod.yml config
