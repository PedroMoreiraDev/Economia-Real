# Configurações Estritas de Produção (Profile: prod)
spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true

app:
  security:
    # Em produção, JWT_SECRET é OBRIGATÓRIA e não possui valor padrão, garantindo Fail-Fast
    jwt-secret: ${JWT_SECRET}
    encryption:
      master-key: ${ENCRYPTION_MASTER_KEY:economiarealsecretkey2026aes256bit!}

cors:
  # Em produção, origens permitidas devem ser explicitamente configuradas
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
