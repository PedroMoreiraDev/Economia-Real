spring:
  datasource:
    url: jdbc:h2:mem:finance_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    jwt-secret: super-secret-jwt-key-finance-ai-2026-minimum-32-chars-long!

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
