<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Principal -->
    <title>Economia Real — Gestão Financeira Pessoal com IA</title>
    <meta
      name="description"
      content="Assuma o controle financeiro pessoal com precisão contábil. Importe faturas e extratos em PDF, OFX ou CSV, lance gastos por voz com Inteligência Artificial e separe gastos reais de faturas."
    />
    <meta
      name="keywords"
      content="controle financeiro pessoal, gestão financeira pessoal, fintech, importar fatura cartão de crédito, gerenciador financeiro com IA, controle de gastos por voz, finanças pessoais brasil, economia real"
    />
    <meta name="author" content="Economia Real" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#102D25" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://economiareal.com.br/" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" href="/logo-economia-real.png" />
    <link rel="apple-touch-icon" href="/logo-economia-real.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Economia Real" />
    <meta property="og:title" content="Economia Real — Gestão Financeira Pessoal Inteligente" />
    <meta
      property="og:description"
      content="Chega de planilhas manuais. Importe faturas em 1 clique, registre despesas por voz com IA e tenha clareza absoluta sobre suas finanças pessoais."
    />
    <meta property="og:url" content="https://economiareal.com.br/" />
    <meta property="og:image" content="https://economiareal.com.br/logo-economia-real.png" />
    <meta property="og:image:alt" content="Logo do Economia Real — Gestão Financeira Pessoal" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Economia Real — Gestão Financeira Pessoal Inteligente" />
    <meta
      name="twitter:description"
      content="Importe faturas em segundos, lance despesas por voz com IA e descubra para onde seu dinheiro realmente vai."
    />
    <meta name="twitter:image" content="https://economiareal.com.br/logo-economia-real.png" />

    <!-- Dados Estruturados JSON-LD (Schema.org SoftwareApplication + FAQPage) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Economia Real",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "Web, iOS, Android",
            "url": "https://economiareal.com.br/",
            "image": "https://economiareal.com.br/logo-economia-real.png",
            "description": "Plataforma de gestão financeira pessoal com Inteligência Artificial que importa faturas PDF/OFX/CSV, transcreve gastos por voz e previne dupla contagem de cartão de crédito.",
            "offers": {
              "@type": "Offer",
              "price": "0.00",
              "priceCurrency": "BRL"
            },
            "featureList": [
              "Importação automática de faturas e extratos em PDF, OFX e CSV",
              "Lançamento de transações por comando de voz com Inteligência Artificial",
              "Prevenção contábil contra dupla contagem de faturas de cartão de crédito",
              "Sugestão inteligente de metas de gastos por categoria",
              "Gráficos de evolução financeira e distribuição de despesas"
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Preciso digitar a senha do meu banco para usar o Economia Real?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Não! O Economia Real nunca pede sua senha bancária ou token de acesso. Você pode registrar gastos falando no microfone ou arrastando o arquivo PDF, OFX ou CSV da sua fatura."
                }
              },
              {
                "@type": "Question",
                "name": "Como o Economia Real evita somar a fatura do cartão duas vezes?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "O motor contábil do Economia Real separa o registro das compras parceladas da liquidação do pagamento da fatura, garantindo que seu saldo mensal reflita a realidade exata sem duplicidade."
                }
              },
              {
                "@type": "Question",
                "name": "Quais bancos e formatos de arquivo são aceitos na importação?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Aceitamos arquivos PDF, OFX e CSV dos principais bancos brasileiros, incluindo Nubank, Itaú, Bradesco, Santander, Banco Inter, C6 Bank, BTG Pactual, XP e Banco do Brasil."
                }
              }
            ]
          }
        ]
      }
    </script>

    <!-- Fontes Google: Plus Jakarta Sans, Inter, Instrument Serif e JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#E8E4D9] text-[#102D25] antialiased selection:bg-[#1C4939] selection:text-[#E8E4D9]">
    <div id="root"></div>

    <!-- Conteúdo semântico de fallback para motores de busca que não executam JS -->
    <noscript>
      <main style="max-width: 800px; margin: 40px auto; padding: 20px; font-family: sans-serif; color: #102D25; background: #E8E4D9;">
        <h1>Economia Real — Gestão Financeira Pessoal com IA</h1>
        <p>
          O <strong>Economia Real</strong> é o gerenciador financeiro brasileiro que une comando de voz com Inteligência
          Artificial, importação de faturas de cartão de crédito (PDF, OFX e CSV) e contabilidade sem dupla contagem.
        </p>
        <h2>Principais Funcionalidades</h2>
        <ul>
          <li><strong>Importação de Faturas e Extratos:</strong> Compatível com Nubank, Itaú, Inter, Bradesco, C6, Santander e BB.</li>
          <li><strong>Lançamento por Voz e Texto com IA:</strong> Fale ou digite seus gastos e a IA classifica tudo em segundos.</li>
          <li><strong>Auditoria de Assinaturas e Custos Fixos:</strong> Previsão mensal de contas recorrentes e metas de economia.</li>
          <li><strong>Segurança e Privacidade (LGPD):</strong> Sem exigência de senhas bancárias.</li>
        </ul>
      </main>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
