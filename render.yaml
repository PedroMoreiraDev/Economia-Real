services:
  - type: web
    name: economia-real-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: ohio
    branch: main
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: economia-real-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: economia-real-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: economia-real-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: economia-real-db
    plan: free
    region: ohio
    databaseName: finance_db
    user: finance_user
